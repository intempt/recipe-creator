name: publish-catalog

# Builds the recipe catalog and writes it into the single-metadata recipe
# database, which is what the console and intempt.com read.
#
#   staging branch -> the staging recipe database   internal testing
#   main branch    -> the production recipe database  what customers see
#
# The QA gate is the staging to main promotion this org already runs on every
# repo, not a new mechanism.
#
# CDN publish removed 2026-10-08. This workflow used to also upload the catalog
# to S3 behind cdn.intempt.com (recipes/staging.json, recipes/v/<sha>.json,
# recipes/latest.json and their -groups twins) and invalidate CloudFront. The
# website no longer reads that catalog: it reads GET /v1/recipes from
# llm-wrapper, which is served from the database the sync step below writes.
# Objects already uploaded to the bucket were left in place, not deleted.

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  # One publish at a time per branch, so two racing runs cannot write the
  # database out of order.
  group: publish-catalog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml

      # Never publish a catalog that would not pass review. The gate is the same
      # one that runs on pull requests, so a direct push cannot ship copy a PR
      # would have been blocked for.
      - name: The catalog builds and its customer-facing copy is clean
        run: python3 scripts/build_artifacts.py --out dist --check

      - name: Ids and slash commands are unique
        run: python3 scripts/check_recipe_identity.py

      # GITHUB_SHA comes from the runner environment rather than a ${{ }}
      # interpolation, so nothing is ever substituted into the shell text itself.
      - name: Build the catalog
        run: python3 scripts/build_artifacts.py --out dist --version "$GITHUB_SHA"

      - name: Write the Marketplace into the recipe database
        if: env.SYNC_URL != ''
        run: python3 scripts/sync_marketplace.py --catalog dist/recipes.json --recipes recipes --url "$SYNC_URL"
        env:
          SYNC_URL: ${{ github.ref == 'refs/heads/main' && secrets.MARKETPLACE_SYNC_URL_PRODUCTION || secrets.MARKETPLACE_SYNC_URL_STAGING }}
          MARKETPLACE_SYNC_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.MARKETPLACE_SYNC_SECRET_PRODUCTION || secrets.MARKETPLACE_SYNC_SECRET_STAGING }}

      - name: Say the database sync is not configured yet
        if: env.SYNC_URL == ''
        run: echo "::warning::MARKETPLACE_SYNC_URL is not set for this branch, so the recipe database was not updated"
        env:
          SYNC_URL: ${{ github.ref == 'refs/heads/main' && secrets.MARKETPLACE_SYNC_URL_PRODUCTION || secrets.MARKETPLACE_SYNC_URL_STAGING }}

      - name: Say what was published
        run: |
          COUNT=$(python3 -c "import json;print(json.load(open('dist/recipes.json'))['count'])")
          echo "### Catalog built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| recipes | ${COUNT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| version | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| branch | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"