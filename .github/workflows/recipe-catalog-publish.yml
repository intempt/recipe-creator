name: recipe-catalog-publish

# Publishes the WHOLE catalog to single-metadata on a release tag (blu-on-jp P9 recipes):
#
#   git tag catalog/<yyyy-mm-dd>[-n] <a commit on main> && git push origin catalog/<...>
#
# scripts/build_catalog.py turns every recipes/*/*/recipe.md into its portable recipe
# (scripts/portable.py) and checks it with the rules single-metadata applies; then
# scripts/publish_catalog.py POSTs {ref, recipes} to `catalog_url` in
# .github/recipe-git-validate.json with the header x-recipe-validate-secret.
# SM upserts by frontmatter_id: unchanged skipped, changed = a new version (rebuilt by the
# engine, Install / Coming soon), a recipe missing from the body = archived. The body is
# always the whole catalog, so never publish a partial tree.
#
# A recipe SM refuses stays unpublished (the others are published) and fails the run.
# The only secret is RECIPE_GIT_VALIDATE_SECRET (the one the other recipe routes check).

on:
  push:
    tags: ['catalog/**']

concurrency:
  group: recipe-catalog-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit of main"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the YAML parser the scripts need
        run: pip install --quiet pyyaml
      - name: Build and check the catalog
        working-directory: scripts
        run: |
          python3 build_catalog.py --root .. --check
          python3 build_catalog.py --root .. --ref "$GITHUB_REF_NAME@$GITHUB_SHA" --out ../catalog-body.json
      - name: Publish to single-metadata
        env:
          RECIPE_GIT_VALIDATE_SECRET: ${{ secrets.RECIPE_GIT_VALIDATE_SECRET }}
        run: python3 scripts/publish_catalog.py catalog-body.json
