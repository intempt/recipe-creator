name: recipe-prerequisites

# Server-side enforcement of BC-RCP-015: a recipe naming an integration must
# declare it under `prerequisites.integrations`.
#
# The requirement it protects is BC-RCP-010 — Blu checks prerequisites before
# offering Run, and disables Run with a Connect affordance when one is missing.
# That check reads `prerequisites.integrations`, so a recipe that names Shopify
# in its text and declares nothing gets an enabled Run button and a workflow
# that dies at the connector.
#
# This existed as a requirement long before it existed as a gate, and the
# catalogue drifted all the way away from it: 287 of 292 recipes declared
# nothing while 54 named a connector. Nothing failed, because nothing was
# checking. A requirement with no enforcement is a requirement that will be
# false within a quarter and nothing will tell you — which is the whole reason
# this file exists rather than a note in a review checklist.
#
# Runs on every PR to staging (the default branch, where contributions land) and
# to main, and on pushes to both so a direct commit cannot bypass it either.
#
# staging was missing until 2026-09-20. The guard triggered on main only while the
# default branch is staging, so it had never once run on a contribution PR: every
# recorded run was a push to main or the promotion PR. A guard on the wrong branch
# reports green by never running.
#
# PULL REQUESTS run this only when they touch recipe content — recipes/, draft/,
# examples/ (Beso 2026-10-07: "shouldn't run for regular PRs which are not for new
# recipes"). Pushes to staging and main still run it on every push, so a merged
# change is always checked.
#
# Two costs of that filter, accepted:
#   - A PR that changes only scripts/ or the workflows gets no CI run of these checks
#     or the script tests; run `scripts/prerequisites_gate.sh` locally before merging.
#   - Branch protection must NOT list `prerequisites` as a required check while this
#     filter is here: GitHub reports no status for a workflow a `paths:` filter
#     skipped, so every PR outside these paths would sit at "Expected" forever.
#     (staging has no required checks on 2026-10-07.)

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "recipes/**"
      - "draft/**"
      - "examples/**"
  push:
    branches: [staging, main]

jobs:
  prerequisites:
    runs-on: intempt-ubuntu-github-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The integration-declaration guard was removed 2026-10-09 (Beso, R35-2/R35-4):
      # LM's step check derives `prerequisites.integrations`; authors no longer declare it.
      - name: Install the YAML parser the catalog build needs
        run: pip install --quiet pyyaml
      # The copy gate. Fails on an empty or quote-wrapped shortDescription, on an
      # em-dash, en-dash or arrow in customer-visible copy, and on a duplicate id.
      # These are the fields the website and the console both render, so a defect
      # here is a defect a customer reads.
      - name: The catalog builds and its customer-facing copy is clean
        run: python3 scripts/build_artifacts.py --out /tmp/catalog --check
      - name: The recipe.md contract tests pass
        run: python3 scripts/tests/test_recipe_contract.py
      - name: Every script's tests pass
        run: for t in scripts/tests/test_*.py; do python3 "$t" || exit 1; done

      - name: Our entity list matches what the engine can build
        if: env.ENGINE_READ_TOKEN != ''
        run: |
          curl -fsSL -H "Authorization: Bearer ${ENGINE_READ_TOKEN}" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/intempt/llm-wrapper/contents/src/blu_chat/sevices/recipes/md_import.py?ref=main" -o /tmp/md_import.py
          python3 scripts/check_engine_entities.py /tmp/md_import.py
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}

      - name: Say the engine drift check is not configured
        if: env.ENGINE_READ_TOKEN == ''
        run: echo "::warning::ENGINE_READ_TOKEN is not set, so the entity list was not compared with llm-wrapper"
        env:
          ENGINE_READ_TOKEN: ${{ secrets.ENGINE_READ_TOKEN }}
      - name: No recipe or example carries prompt injection
        run: python3 scripts/injection.py recipes examples
      - name: No recipe or example carries a value that only exists in one workspace
        run: python3 scripts/portability.py recipes examples
      - name: Every recipe and example is normalised
        run: python3 scripts/normalise_recipe.py --check recipes examples
      - name: Every recipe.md meets the v2 contract the engine reads
        run: python3 scripts/validate_recipes.py --lint
      - name: The examples meet the contract too
        run: python3 scripts/validate_recipes.py --recipes examples --lint && python3 scripts/rebuild_bodies.py --recipes examples --check
      - name: references/entities.md matches the recipes
        run: python3 scripts/render_entities_doc.py --check
      - name: Ids and slash commands are unique, and ids match their folders
        run: python3 scripts/check_recipe_identity.py
      - name: Every git-format recipe.md agrees with its recipe.json
        run: python3 scripts/check_recipe_consistency.py
      # The body is generated from the frontmatter, so a hand-edited one is drift
      # by definition. Rewriting the copy across 302 recipes left every body
      # quoting step titles that no longer existed.
      - name: Every markdown body matches its frontmatter
        run: python3 scripts/rebuild_bodies.py --check
      - name: The plugin's copies of the references and validator match the root
        run: python3 scripts/sync_plugin.py --check
      - name: The plugin's bundled validator runs on its bundled examples
        run: python3 plugin/skills/intempt-recipe-creator/scripts/validate_recipes.py --lint --recipes plugin/skills/intempt-recipe-creator/references/examples
      - name: The plugin's bundled scans run on its bundled examples
        run: python3 plugin/skills/intempt-recipe-creator/scripts/injection.py plugin/skills/intempt-recipe-creator/references/examples && python3 plugin/skills/intempt-recipe-creator/scripts/portability.py plugin/skills/intempt-recipe-creator/references/examples