name: recipe-git-validate

# Every recipe.md a pull request adds or changes is sent to llm-wrapper's
# POST /v1/recipes/git_validate: markdown → steps, then the per-step check with
# no tenant (steps read earlier outputs correctly; no step is vague). Any failing
# step fails the job, listed per step.
#
# Job 2 then runs the real Validate of each recipe job 1 passed, on the recipe
# object job 1 got back (the artifact — never re-read), in the CI project named
# in .github/recipe-git-validate.json. Every step executes; the entities it
# creates stay in that project.
# It is skipped when job 1 passed no recipe — a skipped job still reports.
#
# Job 3, after job 2 passes, commits back to the PR head branch (RG1 §51.3a,
# §55, §57): recipe.json beside each validated recipe.md (job 1's answer, the
# object job 2 ran — what the main-tag deploy sends, recipe-deploy.yml), and a
# `description:` line in that recipe.md ONLY when its frontmatter has none. A
# description the author set is never touched; industry is not written to the md.
# Which md an answer belongs to is the path job 1 recorded (<f_id>.path), never
# re-read from the md.
# A GITHUB_TOKEN commit does not retrigger workflows. A fork PR gets no write
# token, so job 3 skips it with a notice.
#
# OPT-IN: nothing runs unless the PR carries the `validate-recipes` label —
# adding the label starts it, and each push while the label stays reruns it.
# A PR without the label gets no model calls and creates no entities; both jobs
# show as skipped, so this must not be a required check.
#
# URL and the CI project (org/project/person) are config, not secrets:
# .github/recipe-git-validate.json. The only secret is RECIPE_GIT_VALIDATE_SECRET.
#
# No `paths:` filter: a labelled PR touching no recipe exits 0 at once.

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, labeled]

jobs:
  git-validate:
    # `labeled` fires for every label; only this one should start a run.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'validate-recipes') &&
      (github.event.action != 'labeled' || github.event.label.name == 'validate-recipes')
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every changed recipe passes the engine's per-step check
        id: check
        run: |
          python3 scripts/git_validate_recipes.py --base "origin/${{ github.base_ref }}" --out checked
          echo "passed=$(ls checked/*.json 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
        env:
          RECIPE_GIT_VALIDATE_SECRET: ${{ secrets.RECIPE_GIT_VALIDATE_SECRET }}
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.passed != '0'
        with:
          name: checked-recipes
          path: checked/
          retention-days: 7

  git-validate-run:
    needs: git-validate
    if: needs.git-validate.outputs.passed != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: checked-recipes
          path: checked
      - name: Every checked recipe validates when it really runs
        run: python3 scripts/git_validate_run_recipes.py checked
        env:
          RECIPE_GIT_VALIDATE_SECRET: ${{ secrets.RECIPE_GIT_VALIDATE_SECRET }}

  git-validate-writeback:
    needs: [git-validate, git-validate-run]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: A fork PR cannot be written back
        id: where
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::notice::Fork PR ($HEAD_REPO): no write token, so recipe.json and the description are not committed back. Add them by hand or re-open from a branch of $GITHUB_REPOSITORY."
            echo "fork=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.where.outputs.fork != 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.where.outputs.fork != 'true'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: steps.where.outputs.fork != 'true'
        with:
          name: checked-recipes
          path: ${{ runner.temp }}/checked
      - name: Write recipe.json (and a missing description) beside each validated recipe
        if: steps.where.outputs.fork != 'true'
        run: python3 scripts/git_validate_writeback.py "$RUNNER_TEMP/checked"
      - name: Commit to the PR head branch
        if: steps.where.outputs.fork != 'true'
        run: |
          git add -- recipes/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "recipes: recipe.json + description from git validate"
          if ! git push origin "HEAD:refs/heads/$HEAD_REF"; then
            if [ "$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" != "$HEAD_SHA" ]; then
              echo "::warning::$HEAD_REF moved since this run started; the newer push's run writes back."
              exit 0
            fi
            exit 1
          fi
