name: recipe-git-validate

# Every recipe.md a pull request adds or changes is sent to llm-wrapper's
# POST /v1/recipes/git_validate: markdown → steps, then the per-step check with
# no tenant (steps read earlier outputs correctly; no step is vague). Any failing
# step fails the job, listed per step.
#
# Job 2 then runs the real Validate of each recipe job 1 passed, on the recipe
# object job 1 got back (the artifact — never re-read), in the CI project named
# by secrets. Every step executes; the entities it creates stay in that project.
# It is skipped when job 1 passed no recipe — a skipped job still reports.
#
# OPT-IN: nothing runs unless the PR carries the `validate-recipes` label —
# adding the label starts it, and each push while the label stays reruns it.
# A PR without the label gets no model calls and creates no entities; both jobs
# show as skipped, so this must not be a required check.
#
# No `paths:` filter: a labelled PR touching no recipe exits 0 at once.

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, labeled]

jobs:
  git-validate:
    # `labeled` fires for every label; only this one should start a run.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'validate-recipes') &&
      (github.event.action != 'labeled' || github.event.label.name == 'validate-recipes')
    runs-on: intempt-ubuntu-github-runner
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every changed recipe passes the engine's per-step check
        id: check
        run: |
          python3 scripts/git_validate_recipes.py --base "origin/${{ github.base_ref }}" --out checked
          echo "passed=$(ls checked/*.json 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
        env:
          RECIPE_GIT_VALIDATE_URL: ${{ secrets.RECIPE_GIT_VALIDATE_URL }}
          RECIPE_GIT_VALIDATE_SECRET: ${{ secrets.RECIPE_GIT_VALIDATE_SECRET }}
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.passed != '0'
        with:
          name: checked-recipes
          path: checked/
          retention-days: 7

  git-validate-run:
    needs: git-validate
    if: needs.git-validate.outputs.passed != '0'
    runs-on: intempt-ubuntu-github-runner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: checked-recipes
          path: checked
      - name: Every checked recipe validates when it really runs
        run: python3 scripts/git_validate_run_recipes.py checked
        env:
          RECIPE_GIT_VALIDATE_URL: ${{ secrets.RECIPE_GIT_VALIDATE_URL }}
          RECIPE_GIT_VALIDATE_SECRET: ${{ secrets.RECIPE_GIT_VALIDATE_SECRET }}
          RECIPE_GIT_RUN_ORG_ID: ${{ secrets.RECIPE_GIT_RUN_ORG_ID }}
          RECIPE_GIT_RUN_PROJECT_ID: ${{ secrets.RECIPE_GIT_RUN_PROJECT_ID }}
          RECIPE_GIT_RUN_PERSON_ID: ${{ secrets.RECIPE_GIT_RUN_PERSON_ID }}
